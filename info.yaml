# Tiny Tapeout project information
project:
  title:        "UMARV sensor fusion"      # Project title
  author:       "cheerfulconnor78"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Square-root unscented Kalman filter with VN-300 and dead-wheel encoder acquisition"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_umigv_sensorfusion"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "srukf_core.v"
    - "timestamper.sv"
    - "tt_um_umigv_sensorfusion.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "VN-300 serial data (vn_rx)"
  ui[1]: "Encoder SPI MISO"
  ui[2]: "Enable (1 = run)"
  ui[3]: "Check encoder turn-count parity (1 = on)"
  ui[4]: "Measurement-noise byte write strobe"
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "VN-300 SyncIn pulse"
  uo[1]: "Encoder SPI CS_N"
  uo[2]: "Encoder SPI SCK"
  uo[3]: "Encoder SPI MOSI"
  uo[4]: "Measurements ready pulse"
  uo[5]: "SR-UKF result serial data"
  uo[6]: "SR-UKF result frame"
  uo[7]: "Sticky SR-UKF fault"

  # Bidirectional pins
  uio[0]: "Noise data bit 0"
  uio[1]: "Noise data bit 1"
  uio[2]: "Noise data bit 2"
  uio[3]: "Noise data bit 3"
  uio[4]: "Noise data bit 4"
  uio[5]: "Noise data bit 5"
  uio[6]: "Noise data bit 6"
  uio[7]: "Noise data bit 7"

# Do not change!
yaml_version: 6
